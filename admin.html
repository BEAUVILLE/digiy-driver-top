<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>DIGIY DRIVER — Centrale Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg:#050814;
      --card:#020617;
      --card-soft:#0b1120;
      --gold:#facc15;
      --gold-dark:#b45309;
      --white:#f9fafb;
      --gray:#9ca3af;
      --gray-soft:#4b5563;
      --green:#22c55e;
      --red:#ef4444;
      --orange:#f97316;
      --line:#111827;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
    }

    body{
      background:radial-gradient(circle at top,#111827 0,#020617 52%,#020617 100%);
      color:var(--white);
      min-height:100vh;
    }

    /* ===== LOGIN ===== */
    .login-screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px;
    }

    .login-card{
      width:100%;
      max-width:380px;
      background:radial-gradient(circle at top,#0b1120 0,#020617 60%,#020617 100%);
      border-radius:24px;
      padding:26px 20px 22px;
      border:1px solid rgba(250,204,21,0.45);
      box-shadow:0 28px 70px rgba(0,0,0,0.85);
      position:relative;
      overflow:hidden;
    }

    .login-card::before{
      content:"";
      position:absolute;
      inset:-120px;
      background:radial-gradient(circle at 10% 0,rgba(250,204,21,0.24),transparent 55%),
                 radial-gradient(circle at 90% 0,rgba(56,189,248,0.22),transparent 55%);
      opacity:0.9;
      pointer-events:none;
    }

    .login-inner{position:relative;z-index:1;}

    .login-logo{
      display:flex;
      justify-content:center;
      margin-bottom:8px;
    }

    .login-logo-badge{
      width:58px;
      height:58px;
      border-radius:999px;
      border:1px solid rgba(250,204,21,0.8);
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle,#facc15 0,#b45309 52%,#020617 100%);
      color:#020617;
      font-size:28px;
      box-shadow:0 0 30px rgba(250,204,21,0.85);
    }

    .login-title{
      text-align:center;
      font-size:18px;
      font-weight:700;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:var(--gold);
      margin-bottom:4px;
    }

    .login-subtitle{
      text-align:center;
      font-size:12px;
      color:var(--gray);
      margin-bottom:20px;
    }

    .login-input{
      width:100%;
      padding:11px 12px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.7);
      background:rgba(15,23,42,0.96);
      color:var(--white);
      font-size:14px;
      outline:none;
      margin-bottom:12px;
      transition:all 0.15s;
    }

    .login-input::placeholder{color:#6b7280;}

    .login-input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 1px rgba(250,204,21,0.9),0 0 22px rgba(250,204,21,0.38);
    }

    .login-btn{
      width:100%;
      margin-top:4px;
      padding:11px 14px;
      border-radius:999px;
      border:none;
      background:linear-gradient(135deg,#facc15,#f97316);
      color:#111827;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:0.16em;
      box-shadow:0 18px 45px rgba(250,204,21,0.6);
      transition:all 0.2s;
    }

    .login-btn:hover{
      transform:translateY(-1px) scale(1.01);
      box-shadow:0 26px 60px rgba(250,204,21,0.75);
    }

    .login-error{
      margin-top:10px;
      font-size:12px;
      color:var(--red);
      display:none;
      text-align:center;
    }

    /* ===== ADMIN DASHBOARD ===== */
    .admin-dashboard{display:none;min-height:100vh;}

    .admin-header{
      background:linear-gradient(135deg,#020617,#020617,#020617);
      padding:12px 16px;
      border-bottom:1px solid rgba(148,163,184,0.35);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .admin-logo{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .admin-logo-icon{
      width:34px;
      height:34px;
      border-radius:999px;
      border:1px solid rgba(250,204,21,0.7);
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle,#facc15 0,#b45309 52%,#020617 100%);
      color:#020617;
      font-size:20px;
      box-shadow:0 0 24px rgba(250,204,21,0.7);
    }

    .admin-logo-text{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .admin-logo-main{
      font-size:14px;
      font-weight:700;
      letter-spacing:0.16em;
      text-transform:uppercase;
      color:var(--gold);
    }

    .admin-logo-sub{
      font-size:11px;
      color:var(--gray);
      text-transform:uppercase;
      letter-spacing:0.08em;
    }

    .admin-user{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .realtime-badge{
      display:flex;
      align-items:center;
      gap:6px;
      background:rgba(15,23,42,0.96);
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      border:1px solid rgba(148,163,184,0.5);
    }

    .realtime-dot{
      width:9px;
      height:9px;
      border-radius:999px;
      background:var(--green);
      box-shadow:0 0 0 4px rgba(34,197,94,0.4);
      animation:pulse 1.6s infinite;
    }

    @keyframes pulse{
      0%{box-shadow:0 0 0 3px rgba(34,197,94,0.6);}
      70%{box-shadow:0 0 0 9px rgba(34,197,94,0);}
      100%{box-shadow:0 0 0 3px rgba(34,197,94,0);}
    }

    .admin-user-name{
      font-size:12px;
      color:var(--gray);
    }

    .logout-btn{
      border-radius:999px;
      border:1px solid rgba(239,68,68,0.7);
      background:rgba(127,29,29,0.7);
      color:#fecaca;
      font-size:11px;
      font-weight:600;
      padding:6px 10px;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:0.08em;
    }

    .logout-btn:hover{
      background:#ef4444;
      color:white;
      box-shadow:0 0 18px rgba(239,68,68,0.7);
    }

    /* STATS BAR */
    .stats-bar{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      padding:12px 12px 10px;
    }

    .stat-card{
      background:radial-gradient(circle at top,#020617 0,#020617 55%,#020617 100%);
      border-radius:16px;
      padding:12px 10px;
      border:1px solid rgba(31,41,55,0.95);
      text-align:center;
      box-shadow:0 16px 40px rgba(15,23,42,0.96);
    }

    .stat-icon{font-size:20px;margin-bottom:4px;}
    .stat-value{font-size:18px;font-weight:700;color:var(--gold);}
    .stat-label{font-size:11px;color:var(--gray);margin-top:2px;}

    .stat-card.online .stat-value{color:var(--green);}
    .stat-card.offline .stat-value{color:var(--gray-soft);}

    /* LAYOUT PRINCIPAL */
    .admin-content{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:0;
      height:calc(100vh - 150px);
      border-top:1px solid rgba(15,23,42,0.9);
    }

    #adminMap{
      width:100%;
      height:100%;
      min-height:320px;
    }

    .drivers-panel{
      background:radial-gradient(circle at top,#020617 0,#020617 60%,#020617 100%);
      border-left:1px solid rgba(15,23,42,0.9);
      display:flex;
      flex-direction:column;
    }

    .panel-header{
      padding:12px 12px 10px;
      border-bottom:1px solid rgba(15,23,42,0.9);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .panel-title{
      font-size:14px;
      font-weight:600;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .refresh-btn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(250,204,21,0.7);
      background:rgba(15,23,42,0.96);
      color:var(--gold);
      font-size:11px;
      font-weight:600;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .drivers-filters{
      padding:8px 10px;
      border-bottom:1px solid rgba(15,23,42,0.9);
      display:flex;
      gap:6px;
    }

    .filter-btn{
      flex:1;
      padding:6px 6px;
      border-radius:999px;
      border:none;
      background:#020617;
      color:var(--gray);
      font-size:11px;
      font-weight:600;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:0.06em;
    }

    .filter-btn.active{
      background:var(--gold);
      color:#111827;
    }

    .drivers-list{
      flex:1;
      overflow-y:auto;
      padding:8px 8px 10px;
    }

    .driver-card{
      background:#020617;
      border-radius:12px;
      padding:10px;
      margin-bottom:8px;
      border-left:3px solid rgba(148,163,184,0.9);
      transition:all 0.15s;
      box-shadow:0 10px 28px rgba(15,23,42,0.95);
    }

    .driver-card.online{border-left-color:var(--green);}
    .driver-card.offline{border-left-color:var(--gray-soft);}
    .driver-card.pending{border-left-color:var(--orange);}

    .driver-card:hover{
      transform:translateY(-1px);
      border-color:var(--gold);
      box-shadow:0 18px 40px rgba(0,0,0,0.9);
    }

    .driver-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      margin-bottom:6px;
    }

    .driver-name{font-size:13px;font-weight:600;}
    .driver-status{
      padding:3px 8px;
      border-radius:999px;
      font-size:10px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.08em;
    }

    .driver-status.online{
      background:rgba(22,163,74,0.16);
      color:#bbf7d0;
    }

    .driver-status.offline{
      background:rgba(75,85,99,0.25);
      color:#e5e7eb;
    }

    .driver-status.pending{
      background:rgba(245,158,11,0.18);
      color:#fed7aa;
    }

    .driver-info{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      font-size:11px;
      color:var(--gray);
      margin-bottom:6px;
    }

    .driver-info span{display:flex;align-items:center;gap:4px;}

    .driver-actions{
      display:flex;
      gap:6px;
    }

    .action-btn{
      flex:1;
      padding:6px;
      border-radius:8px;
      border:none;
      font-size:11px;
      font-weight:600;
      cursor:pointer;
    }

    .action-btn.locate{
      background:rgba(59,130,246,0.2);
      color:#bfdbfe;
    }

    .action-btn.call{
      background:rgba(22,163,74,0.2);
      color:#bbf7d0;
    }

    /* SOS PANEL */
    .sos-alert-panel{
      background:radial-gradient(circle at top,#7f1d1d 0,#450a0a 60%,#020617 100%);
      border-bottom:1px solid rgba(127,29,29,0.8);
      border-top:1px solid rgba(127,29,29,0.8);
      max-height:0;
      overflow:hidden;
      transition:max-height 0.25s ease;
    }

    .sos-alert-panel.show{max-height:360px;}

    .sos-alert-header{
      padding:10px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .sos-alert-title{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      font-weight:700;
    }

    .sos-alert-title .icon{
      font-size:18px;
      animation:pulse 0.9s infinite;
    }

    .sos-alert-count{
      background:white;
      color:var(--red);
      padding:4px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
    }

    .sos-alerts-list{
      padding:6px 10px 10px;
      max-height:280px;
      overflow-y:auto;
    }

    .sos-alert-item{
      background:rgba(248,113,113,0.08);
      border-radius:14px;
      border:1px solid rgba(248,113,113,0.9);
      padding:8px 9px;
      margin-bottom:6px;
      box-shadow:0 12px 30px rgba(0,0,0,0.6);
    }

    .sos-alert-item-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:4px;
    }

    .sos-driver-name{font-size:13px;font-weight:600;}
    .sos-type{
      background:var(--red);
      color:white;
      padding:3px 8px;
      border-radius:999px;
      font-size:10px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.06em;
    }

    .sos-alert-info{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      font-size:11px;
      color:#fecaca;
      margin-bottom:6px;
    }

    .sos-alert-actions{
      display:flex;
      gap:6px;
    }

    .sos-action-btn{
      flex:1;
      padding:6px;
      border-radius:8px;
      border:none;
      font-size:11px;
      font-weight:700;
      cursor:pointer;
    }

    .sos-action-btn.locate{background:#1d4ed8;color:white;}
    .sos-action-btn.call{background:#16a34a;color:white;}
    .sos-action-btn.resolve{background:#facc15;color:#111827;}

    /* Leaflet marker base */
    .custom-marker{transform:translate(-50%,-50%);}

    @keyframes spin{
      0%{transform:rotate(0deg);}
      100%{transform:rotate(360deg);}
    }

    /* Responsive */
    @media (max-width:900px){
      .stats-bar{grid-template-columns:repeat(2,1fr);}
      .admin-content{
        grid-template-columns:1fr;
        height:auto;
      }
      #adminMap{height:320px;}
      .drivers-panel{border-left:none;border-top:1px solid rgba(15,23,42,0.9);}
      .drivers-list{max-height:380px;}
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-inner">
      <div class="login-logo">
        <div class="login-logo-badge">🚗</div>
      </div>
      <div class="login-title">DIGIY DRIVER</div>
      <div class="login-subtitle">Centrale Admin — Accès réservé</div>

      <input id="loginEmail" type="email" class="login-input" placeholder="Email admin">
      <input id="loginPassword" type="password" class="login-input" placeholder="Mot de passe">
      <button class="login-btn" onclick="handleLogin()">🔐 Connexion</button>
      <div id="loginError" class="login-error">Email ou mot de passe incorrect.</div>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminDashboard" class="admin-dashboard">
  <header class="admin-header">
    <div class="admin-logo">
      <div class="admin-logo-icon">🚗</div>
      <div class="admin-logo-text">
        <div class="admin-logo-main">DIGIY DRIVER</div>
        <div class="admin-logo-sub">CENTRALE ADMIN</div>
      </div>
    </div>
    <div class="admin-user">
      <div class="realtime-badge">
        <span class="realtime-dot"></span>
        <span>Temps réel</span>
      </div>
      <span class="admin-user-name">👤 <span id="adminName">Admin</span></span>
      <button class="logout-btn" onclick="handleLogout()">Déconnexion</button>
    </div>
  </header>

  <!-- SOS PANEL -->
  <div id="sosAlertPanel" class="sos-alert-panel">
    <div class="sos-alert-header">
      <div class="sos-alert-title">
        <span class="icon">🆘</span>
        <span>ALERTES SOS</span>
      </div>
      <div id="sosCount" class="sos-alert-count">0</div>
    </div>
    <div id="sosAlertsList" class="sos-alerts-list"></div>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div id="statTotal" class="stat-value">0</div>
      <div class="stat-label">Chauffeurs suivis</div>
    </div>
    <div class="stat-card online">
      <div class="stat-icon">🟢</div>
      <div id="statOnline" class="stat-value">0</div>
      <div class="stat-label">En ligne</div>
    </div>
    <div class="stat-card offline">
      <div class="stat-icon">⚫</div>
      <div id="statOffline" class="stat-value">0</div>
      <div class="stat-label">Hors ligne</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📊</div>
      <div id="statCourses" class="stat-value">0</div>
      <div class="stat-label">Courses aujourd'hui</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="admin-content">
    <div id="adminMap"></div>

    <div class="drivers-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>📋</span><span>Chauffeurs</span>
        </div>
        <button class="refresh-btn" onclick="refreshDrivers()">🔄 Actualiser</button>
      </div>
      <div class="drivers-filters">
        <button class="filter-btn active" onclick="filterDrivers('all',this)">Tous</button>
        <button class="filter-btn" onclick="filterDrivers('online',this)">En ligne</button>
        <button class="filter-btn" onclick="filterDrivers('offline',this)">Hors ligne</button>
        <button class="filter-btn" onclick="filterDrivers('pending',this)">En attente</button>
      </div>
      <div id="driversList" class="drivers-list"></div>
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // =======================
  // FIREBASE CONFIG DIGIYLYFE-ECOSYSTEM
  // =======================
  const firebaseConfig = {
    apiKey: "AIzaSyBqEQWoE2iC7_rp-u4riilNVHolcP2o0B0",
    authDomain: "digiylyfe-ecosystem.firebaseapp.com",
    databaseURL: "https://digiylyfe-ecosystem-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "digiylyfe-ecosystem",
    storageBucket: "digiylyfe-ecosystem.firebasestorage.app",
    messagingSenderId: "1007962643384",
    appId: "1:1007962643384:web:20d26881e87f0dc37d0d4d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  console.log("🔥 Firebase DIGIYLYFE-ECOSYSTEM connecté (ADMIN)");

  // =======================
  // STATE
  // =======================
  const ADMIN_CREDENTIALS = {
    email: "admin@digiylyfe.com",
    password: "DigiyAdmin2024!"
  };

  let map = null;
  let drivers = [];
  let driverMarkers = {};
  let currentFilter = "all";

  // =======================
  // LOGIN
  // =======================
  function handleLogin(){
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    const errEl = document.getElementById("loginError");

    if(email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password){
      errEl.style.display = "none";
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminDashboard").style.display = "block";
      document.getElementById("adminName").textContent = "Super Admin";
      initDashboard();
    }else{
      errEl.style.display = "block";
    }
  }

  function handleLogout(){
    document.getElementById("adminDashboard").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("loginEmail").value = "";
    document.getElementById("loginPassword").value = "";
  }

  document.addEventListener("keypress",(e)=>{
    if(e.key === "Enter" && document.getElementById("loginScreen").style.display !== "none"){
      handleLogin();
    }
  });

  // =======================
  // DASHBOARD INIT
  // =======================
  function initDashboard(){
    initMap();
    listenDriversOnline();
    listenSOS();
    listenRidesForStats();
    console.log("✅ Dashboard ADMIN DIGIY initialisé.");
  }

  function initMap(){
    const SALY_CENTER = [14.445, -17.008]; // approx Saly
    map = L.map("adminMap").setView(SALY_CENTER, 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      attribution:"© DIGIY DRIVER"
    }).addTo(map);
  }

  // =======================
  // FIREBASE LISTENERS
  // =======================
  function listenDriversOnline(){
    db.ref("drivers_online").on("value",(snap)=>{
      const list = [];
      snap.forEach(child=>{
        const d = child.val() || {};
        const id = child.key;

        const position = d.position || d.coords || {};
        const lat = position.lat;
        const lng = position.lng;

        let status = "pending";
        if(lat != null && lng != null){
          status = d.online ? "online" : "offline";
        }

        list.push({
          id,
          name: d.name || ("Chauffeur " + id.slice(-4)),
          phone: d.phone || "",
          vehicle: d.vehicle || "",
          plate: d.plate || "",
          lat,
          lng,
          status,
          courses: d.totalRides || 0
        });
      });

      drivers = list;
      updateStats();
      renderDriversList();
      updateMapMarkers();
    });
  }

  function listenSOS(){
    db.ref("sos_alerts").on("value",(snap)=>{
      const alerts = [];
      snap.forEach(child=>{
        const a = child.val() || {};
        const id = child.key;
        if(a.status === "resolved") return;

        alerts.push({
          id,
          driverName: a.driverName || "Chauffeur",
          driverPhone: a.driverPhone || "",
          driverVehicle: a.driverVehicle || "",
          lat: a.lat,
          lng: a.lng,
          type: a.type || "autre",
          timestamp: a.timestamp || Date.now()
        });
      });
      updateSOSPanel(alerts);
    });
  }

  function listenRidesForStats(){
    db.ref("rides").on("value",(snap)=>{
      let todayCount = 0;
      const todayStr = new Date().toDateString();

      snap.forEach(child=>{
        const r = child.val() || {};
        const status = r.status || "";
        if(status !== "completed" && status !== "paid") return;

        const t = r.completedAt || r.timestamp || r.createdAt;
        if(!t) return;
        const dStr = new Date(t).toDateString();
        if(dStr === todayStr){
          todayCount++;
        }
      });

      document.getElementById("statCourses").textContent = todayCount;
    });
  }

  // =======================
  // SOS PANEL
  // =======================
  function updateSOSPanel(alerts){
    const panel = document.getElementById("sosAlertPanel");
    const listEl = document.getElementById("sosAlertsList");
    const countEl = document.getElementById("sosCount");

    countEl.textContent = alerts.length;

    if(alerts.length === 0){
      panel.classList.remove("show");
      listEl.innerHTML = "";
      return;
    }

    panel.classList.add("show");

    listEl.innerHTML = alerts.map(a=>{
      const types = {
        panne:"🔧 Panne",
        pneu:"🛞 Pneu",
        accident:"💥 Accident",
        securite:"⚠️ Sécurité",
        autre:"❓ Autre"
      };
      const label = types[a.type] || a.type;
      const timeAgo = getTimeAgo(a.timestamp);

      return `
        <div class="sos-alert-item">
          <div class="sos-alert-item-header">
            <span class="sos-driver-name">${a.driverName}</span>
            <span class="sos-type">${label}</span>
          </div>
          <div class="sos-alert-info">
            <span>🚗 ${a.driverVehicle || "Véhicule inconnu"}</span>
            <span>📞 ${a.driverPhone || "—"}</span>
            <span>⏰ ${timeAgo}</span>
          </div>
          <div class="sos-alert-actions">
            <button class="sos-action-btn locate" onclick="locateSOS(${a.lat || "null"},${a.lng || "null"})">📍 Localiser</button>
            <button class="sos-action-btn call" onclick="callDriver('${(a.driverPhone || "").replace(/'/g,\"\\'\")}')">📞 Appeler</button>
            <button class="sos-action-btn resolve" onclick="resolveSOS('${a.id}')">✅ Résolu</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function getTimeAgo(ts){
    if(!ts) return "À l'instant";
    const s = Math.floor((Date.now() - ts)/1000);
    if(s < 60) return "À l'instant";
    if(s < 3600) return Math.floor(s/60) + " min";
    return Math.floor(s/3600) + " h";
  }

  function locateSOS(lat,lng){
    if(map && lat != null && lng != null){
      map.setView([lat,lng], 15);
    }
  }

  function resolveSOS(id){
    if(!confirm("Marquer cette alerte SOS comme résolue ?")) return;
    db.ref("sos_alerts/" + id).update({
      status:"resolved",
      resolvedAt: Date.now()
    }).then(()=>{
      console.log("✅ SOS résolu:", id);
    });
  }

  // =======================
  // DRIVERS LIST + MAP
  // =======================
  function updateStats(){
    const total = drivers.length;
    const online = drivers.filter(d=>d.status === "online").length;
    const offline = drivers.filter(d=>d.status === "offline").length;
    const pending = drivers.filter(d=>d.status === "pending").length;

    document.getElementById("statTotal").textContent = total;
    document.getElementById("statOnline").textContent = online;
    document.getElementById("statOffline").textContent = offline + pending;
  }

  function renderDriversList(){
    const container = document.getElementById("driversList");
    let list = drivers;

    if(currentFilter !== "all"){
      list = drivers.filter(d=>d.status === currentFilter);
    }

    if(list.length === 0){
      container.innerHTML = `
        <div style="text-align:center;padding:26px 8px;color:var(--gray);font-size:13px;">
          <div style="font-size:28px;margin-bottom:4px;">🔍</div>
          Aucun chauffeur pour ce filtre.
        </div>
      `;
      return;
    }

    container.innerHTML = list.map(d=>{
      const statusLabel =
        d.status === "online" ? "🟢 En ligne" :
        d.status === "offline" ? "⚫ Hors ligne" :
        "🟠 En attente";

      return `
        <div class="driver-card ${d.status}">
          <div class="driver-header">
            <div class="driver-name">${d.name}</div>
            <div class="driver-status ${d.status}">${statusLabel}</div>
          </div>
          <div class="driver-info">
            ${d.vehicle ? `<span>🚗 ${d.vehicle}</span>` : ""}
            ${d.plate ? `<span>📃 ${d.plate}</span>` : ""}
            ${d.phone ? `<span>📞 ${d.phone}</span>` : ""}
            <span>📊 ${d.courses || 0} courses</span>
          </div>
          <div class="driver-actions">
            ${d.lat != null && d.lng != null ? `
              <button class="action-btn locate" onclick="locateDriver('${d.id}')">📍 Localiser</button>
            ` : ""}
            <button class="action-btn call" onclick="callDriver('${(d.phone || "").replace(/'/g,\"\\'\")}')">📞 Appeler</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function updateMapMarkers(){
    if(!map) return;

    Object.values(driverMarkers).forEach(m => map.removeLayer(m));
    driverMarkers = {};

    drivers.forEach(d=>{
      if(d.lat == null || d.lng == null) return;

      const isOnline = d.status === "online";
      const markerStyle = `
        background:${isOnline ? "#22c55e" : "#4b5563"};
        width:34px;height:34px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:18px;
        border:3px solid ${isOnline ? "#bbf7d0" : "#9ca3af"};
        box-shadow:0 2px 12px rgba(0,0,0,0.6);
      `;

      const icon = L.divIcon({
        className:"custom-marker",
        html:`<div style="${markerStyle}">🚗</div>`,
        iconSize:[34,34],
        iconAnchor:[17,17]
      });

      const marker = L.marker([d.lat,d.lng],{icon}).addTo(map)
        .bindPopup(`
          <div style="min-width:150px;text-align:center;">
            <strong>${d.name}</strong><br>
            <small>${d.vehicle || ""} ${d.plate || ""}</small><br>
            <small>${d.phone || ""}</small><br>
            <small>${d.status === "online" ? "🟢 En ligne" : d.status === "offline" ? "⚫ Hors ligne" : "🟠 En attente"}</small>
          </div>
        `);

      driverMarkers[d.id] = marker;
    });
  }

  function filterDrivers(filter,btn){
    currentFilter = filter;
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderDriversList();
  }

  function refreshDrivers(){
    updateStats();
    renderDriversList();
    updateMapMarkers();
  }

  function locateDriver(id){
    const d = drivers.find(dr=>dr.id === id);
    if(!d || d.lat == null || d.lng == null) return;
    map.setView([d.lat,d.lng],15);
    if(driverMarkers[id]){
      driverMarkers[id].openPopup();
    }
  }

  function callDriver(phone){
    if(!phone) return;
    window.open("tel:" + phone.replace(/\s/g,""));
  }
</script>

</body>
</html>
